name = "Haml"
grammar = "haml"
path_suffixes = ["haml", "html.haml"]
line_comments = ["-# "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
auto_indent_using_last_non_empty_line = false
tab_size = 2
increase_indent_pattern = '^\s*(?:(?:%[\w:-]+|[.#][\w:@-]+)+(?:\[[^\]]+\])?(?:(?:\s*(?:\([^)]*\)|\{.*\}))*[<>]?|[\[({]|\s*(?:=|!=|&=|~)\s+.*\bdo(?:\s*\|[^|]*\|)?)|:[\w-]+|-\s+(?:(?:if|unless|case|while|until|for|begin|class|module|def|else|elsif|when|rescue|ensure)\b.*|.*\bdo(?:\s*\|[^|]*\|)?)|(?:=|!=|&=|~)\s+.*\bdo(?:\s*\|[^|]*\|)?|/(?:\[[^\]]+\])?|-#|[\])}])\s*$'
decrease_indent_pattern = '^\s*[\])}]\s*$'
